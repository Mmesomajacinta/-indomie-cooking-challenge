<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jessy — Indomie Cooking Challenge</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#101217;
  color:white;
  overflow-x:hidden;
}

button{
  font-family:inherit;
}

#game{
  width:100%;
  max-width:1100px;
  min-height:100vh;
  margin:auto;
  background:#151820;
  position:relative;
}

/* =========================
   TOP BAR
========================= */

.topbar{
  height:72px;
  background:linear-gradient(180deg,#202631,#11151b);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 15px;
  border-bottom:3px solid #e2aa25;
  position:relative;
  z-index:20;
}

.logo{
  font-size:20px;
  font-weight:900;
  letter-spacing:1px;
}

.logo span{
  color:#ffca28;
}

.timerBox,
.scoreBox{
  background:#090b0e;
  border:2px solid #444b57;
  border-radius:12px;
  padding:7px 13px;
  text-align:center;
  min-width:82px;
}

.timerBox.danger{
  border-color:#e53935;
  animation:pulse .5s infinite alternate;
}

@keyframes pulse{
  from{transform:scale(1)}
  to{transform:scale(1.06)}
}

.smallLabel{
  display:block;
  color:#9ca3ad;
  font-size:10px;
  text-transform:uppercase;
}

.value{
  font-size:20px;
  font-weight:900;
}

/* =========================
   STAGE
========================= */

.stage{
  min-height:calc(100vh - 72px);
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 10%,#6d7580 0%,#303640 28%,#171b22 65%,#0e1014 100%);
}

/* studio lights */

.stage:before,
.stage:after{
  content:"";
  position:absolute;
  top:-80px;
  width:280px;
  height:500px;
  background:linear-gradient(
    180deg,
    rgba(255,235,180,.22),
    rgba(255,235,180,0)
  );
  filter:blur(15px);
  transform:rotate(15deg);
  pointer-events:none;
}

.stage:before{
  left:-90px;
}

.stage:after{
  right:-90px;
  transform:rotate(-15deg);
}

/* back wall */

.backWall{
  position:absolute;
  left:0;
  right:0;
  top:0;
  height:43%;
  background:
    linear-gradient(90deg,
      rgba(255,255,255,.05),
      transparent 20%,
      transparent 80%,
      rgba(255,255,255,.05)
    ),
    #252b34;
  border-bottom:5px solid #111;
}

.backWall .showTitle{
  position:absolute;
  left:50%;
  top:35px;
  transform:translateX(-50%);
  font-size:clamp(20px,4vw,42px);
  font-weight:1000;
  letter-spacing:3px;
  color:#fff;
  text-shadow:0 3px 12px #000;
  white-space:nowrap;
}

.backWall .showTitle span{
  color:#ffca28;
}

.wallLight{
  position:absolute;
  width:70px;
  height:30px;
  top:15px;
  border-radius:50%;
  background:#fff4cf;
  box-shadow:0 0 35px 15px rgba(255,225,150,.4);
}

.wallLight.one{left:12%}
.wallLight.two{left:45%}
.wallLight.three{right:12%}

/* floor */

.floor{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:62%;
  background:
    repeating-linear-gradient(
      90deg,
      #272b31 0px,
      #272b31 75px,
      #1e2228 76px,
      #1e2228 150px
    );
  transform:perspective(500px) rotateX(18deg);
  transform-origin:bottom;
  opacity:.9;
}

/* =========================
   CONTESTANT AREA
========================= */

contestantArea{
  display:block;
}

.contestant{
  position:absolute;
  left:8%;
  top:21%;
  width:260px;
  height:370px;
  z-index:7;
}

.contestantGlow{
  position:absolute;
  bottom:20px;
  left:20px;
  width:210px;
  height:40px;
  border-radius:50%;
  background:#0008;
  filter:blur(8px);
}

.jessyImage{
  position:absolute;
  left:15px;
  bottom:25px;
  width:220px;
  height:330px;
  object-fit:contain;
  object-position:center bottom;
  filter:drop-shadow(0 12px 8px rgba(0,0,0,.55));
  z-index:2;
}

/* if image is transparent, it will blend nicely */

.nameTag{
  position:absolute;
  bottom:0;
  left:40px;
  background:#111;
  border:2px solid #ffca28;
  padding:6px 20px;
  border-radius:20px;
  font-weight:900;
  z-index:5;
}

/* =========================
   JUDGE
========================= */

.judgeArea{
  position:absolute;
  right:7%;
  top:17%;
  width:250px;
  height:330px;
  z-index:7;
}

.judgeCard{
  position:absolute;
  top:0;
  right:0;
  background:rgba(10,12,15,.9);
  border:2px solid #d6a82a;
  border-radius:14px;
  padding:8px 15px;
  z-index:10;
  text-align:center;
  min-width:150px;
}

.judgeCard strong{
  display:block;
  font-size:16px;
}

.judgeCard span{
  color:#ffca28;
  font-size:11px;
}

.judgeImage{
  position:absolute;
  bottom:15px;
  left:0;
  width:240px;
  height:280px;
  object-fit:contain;
  filter:drop-shadow(0 12px 8px rgba(0,0,0,.6));
}

.speech{
  position:absolute;
  top:45px;
  left:-40px;
  width:190px;
  background:white;
  color:#16191d;
  border-radius:15px;
  padding:10px;
  font-size:12px;
  font-weight:bold;
  box-shadow:0 5px 20px #0008;
  z-index:12;
}

.speech:after{
  content:"";
  position:absolute;
  bottom:-12px;
  right:25px;
  border-width:12px 10px 0 10px;
  border-style:solid;
  border-color:white transparent transparent transparent;
}

/* =========================
   COOKING COUNTER
========================= */

counter{
  display:block;
}

.counter{
  position:absolute;
  left:5%;
  right:5%;
  bottom:15%;
  height:175px;
  z-index:9;
  background:
    linear-gradient(#87552f,#59351f);
  border:5px solid #301d12;
  border-radius:20px 20px 10px 10px;
  box-shadow:
    0 18px 30px #000b,
    inset 0 8px 0 rgba(255,255,255,.08);
}

.counterTop{
  height:35px;
  background:linear-gradient(#b87a43,#71431f);
  border-bottom:5px solid #352011;
  border-radius:14px 14px 0 0;
}

/* stove */

.stove{
  position:absolute;
  left:36%;
  top:15px;
  width:220px;
  height:125px;
  background:#11151a;
  border:5px solid #080a0d;
  border-radius:15px;
  box-shadow:inset 0 0 15px #000;
}

.burner{
  position:absolute;
  left:25px;
  right:25px;
  top:15px;
  height:65px;
  border-radius:50%;
  background:
    radial-gradient(circle,
      #111 0 20%,
      #30343a 21% 35%,
      #0c0e12 36% 48%,
      #292d32 49% 58%,
      #0a0b0d 59%);
  border:4px solid #050608;
}

.flame{
  position:absolute;
  left:50%;
  top:18px;
  transform:translateX(-50%);
  font-size:50px;
  opacity:0;
  transition:.3s;
  filter:drop-shadow(0 0 12px #ff6d00);
}

.flame.on{
  opacity:1;
  animation:flame .35s infinite alternate;
}

@keyframes flame{
  from{transform:translateX(-50%) scale(.9)}
  to{transform:translateX(-50%) scale(1.08)}
}

/* pot */

.pot{
  position:absolute;
  left:50%;
  top:40px;
  transform:translateX(-50%);
  width:150px;
  height:70px;
  border-radius:50% 50% 35% 35%;
  background:linear-gradient(#575d63,#171a1e);
  border:5px solid #0a0b0d;
  z-index:5;
  overflow:visible;
}

.potInside{
  position:absolute;
  left:12px;
  right:12px;
  top:8px;
  height:38px;
  border-radius:50%;
  background:#171717;
  overflow:hidden;
}

.noodles{
  position:absolute;
  left:15px;
  right:15px;
  top:7px;
  height:25px;
  border-radius:50%;
  background:
    repeating-linear-gradient(
      0deg,
      #e6ad27 0px,
      #e6ad27 3px,
      #b87916 4px,
      #b87916 6px
    );
  opacity:0;
  transition:.4s;
}

.noodles.show{
  opacity:1;
}

.foodExtras{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  letter-spacing:3px;
  opacity:0;
  transition:.3s;
}

.foodExtras.show{
  opacity:1;
}

.handle{
  position:absolute;
  right:-72px;
  top:22px;
  width:80px;
  height:20px;
  border-radius:20px;
  background:#202328;
  border:4px solid #0b0c0e;
}

/* ingredients on counter */

.ingredientsTray{
  position:absolute;
  left:20px;
  top:55px;
  display:flex;
  gap:7px;
}

.ingredientBox{
  width:55px;
  height:55px;
  border-radius:10px;
  background:#ececec;
  color:#171717;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  box-shadow:0 4px 7px #0008;
  cursor:pointer;
  transition:.15s;
  border:2px solid #bbb;
}

.ingredientBox:active{
  transform:scale(.9);
}

.ingredientBox.selected{
  border:3px solid #ffca28;
  transform:translateY(-7px);
}

/* =========================
   CONTROLS
========================= */

.controls{
  position:absolute;
  left:50%;
  bottom:2.5%;
  transform:translateX(-50%);
  width:92%;
  z-index:15;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
}

.action{
  border:none;
  border-radius:12px;
  padding:12px 5px;
  color:white;
  font-weight:900;
  font-size:12px;
  background:linear-gradient(#39424e,#1a1e24);
  border:2px solid #5c6672;
  box-shadow:0 4px 0 #080a0d;
  cursor:pointer;
}

.action:active{
  transform:translateY(3px);
  box-shadow:0 1px 0 #080a0d;
}

.action.primary{
  background:linear-gradient(#e3a921,#a76c00);
  border-color:#ffd86a;
  color:#171717;
}

.action.danger{
  background:linear-gradient(#d9413d,#8d1d1a);
  border-color:#ff7772;
}

/* =========================
   MESSAGE
========================= */

.message{
  position:absolute;
  left:50%;
  top:6%;
  transform:translateX(-50%);
  background:#0b0d10e8;
  border:2px solid #59616b;
  border-radius:30px;
  padding:10px 18px;
  font-size:13px;
  text-align:center;
  z-index:16;
  min-width:220px;
  max-width:80%;
}

/* =========================
   SCORE POPUP
========================= */

.scorePop{
  position:absolute;
  left:50%;
  top:43%;
  transform:translate(-50%,-50%);
  font-size:35px;
  font-weight:1000;
  color:#ffcf38;
  text-shadow:0 3px 10px #000;
  pointer-events:none;
  opacity:0;
  z-index:30;
}

.scorePop.show{
  animation:scorePop 1s ease-out;
}

@keyframes scorePop{
  0%{
    opacity:0;
    transform:translate(-50%,0) scale(.5);
  }
  30%{
    opacity:1;
    transform:translate(-50%,-30px) scale(1.2);
  }
  100%{
    opacity:0;
    transform:translate(-50%,-100px) scale(1);
  }
}

/* =========================
   RESULT
========================= */

.resultScreen{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(3,4,6,.93);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.resultScreen.show{
  display:flex;
}

.resultCard{
  width:100%;
  max-width:430px;
  text-align:center;
  background:linear-gradient(180deg,#282f38,#11151b);
  border:3px solid #e1ad2c;
  border-radius:24px;
  padding:30px 20px;
  box-shadow:0 20px 60px #000;
}

.resultCard h1{
  margin:0 0 10px;
  color:#ffca28;
}

.finalScore{
  font-size:65px;
  font-weight:1000;
  margin:10px;
}

.resultStars{
  font-size:35px;
  margin:10px;
}

.playAgain{
  border:none;
  padding:14px 30px;
  border-radius:12px;
  background:#e5ad27;
  color:#171717;
  font-weight:1000;
  font-size:16px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .topbar{
    height:62px;
  }

  .logo{
    font-size:13px;
  }

  .timerBox,
  .scoreBox{
    min-width:60px;
    padding:5px 7px;
  }

  .value{
    font-size:16px;
  }

  .stage{
    min-height:760px;
  }

  .backWall{
    height:38%;
  }

  .backWall .showTitle{
    top:25px;
    font-size:19px;
    letter-spacing:1px;
  }

  .contestant{
    left:1%;
    top:16%;
    width:170px;
    height:280px;
  }

  .jessyImage{
    width:160px;
    height:250px;
    left:5px;
  }

  .judgeArea{
    right:0;
    top:14%;
    width:170px;
    height:250px;
  }

  .judgeImage{
    width:165px;
    height:210px;
  }

  .judgeCard{
    min-width:110px;
    padding:5px 8px;
  }

  .judgeCard strong{
    font-size:11px;
  }

  .speech{
    width:140px;
    font-size:10px;
    left:-20px;
  }

  .nameTag{
    left:25px;
    font-size:11px;
    padding:5px 12px;
  }

  .counter{
    left:2%;
    right:2%;
    bottom:17%;
    height:190px;
  }

  .stove{
    left:50%;
    transform:translateX(-50%);
    top:15px;
    width:180px;
  }

  .ingredientsTray{
    left:8px;
    top:75px;
    gap:4px;
  }

  .ingredientBox{
    width:43px;
    height:43px;
    font-size:20px;
  }

  .pot{
    width:125px;
    height:62px;
  }

  .controls{
    bottom:2%;
    grid-template-columns:repeat(2,1fr);
  }

  .message{
    top:5%;
    font-size:11px;
  }
}
</style>
</head>

<body>

<div id="game">

  <div class="topbar">

    <div class="logo">
      JESSY <span>COOKING CHALLENGE</span>
    </div>

    <div class="timerBox" id="timerBox">
      <span class="smallLabel">Time</span>
      <span class="value" id="timer">90</span>
    </div>

    <div class="scoreBox">
      <span class="smallLabel">Score</span>
      <span class="value"><span id="score">0</span></span>
    </div>

  </div>

  <div class="stage">

    <div class="backWall">

      <div class="wallLight one"></div>
      <div class="wallLight two"></div>
      <div class="wallLight three"></div>

      <div class="showTitle">
        INDOMIE <span>COOKING ARENA</span>
      </div>

    </div>

    <div class="floor"></div>

    <!-- CONTESTANT -->

    <div class="contestant">

      <div class="contestantGlow"></div>

      <img
        class="jessyImage"
        src="1787567625036.png"
        alt="Jessy">

      <div class="nameTag">
        👩‍🍳 JESSY
      </div>

    </div>

    <!-- JUDGE -->

    <div class="judgeArea">

      <div class="judgeCard">
        <strong>👩‍⚖️ THE JUDGE</strong>
        <span>MASTER CHEF</span>
      </div>

      <div class="speech" id="speech">
        Welcome, Jessy! Show me what you can cook.
      </div>

      <img
        class="judgeImage"
        src="Screenshot_2026-08-24-11-10-43-58_680d03679600f7af0b4c700c6b270fe7.jpg"
        alt="Judge">

    </div>

    <!-- MESSAGE -->

    <div class="message" id="message">
      Start the challenge and prepare your Indomie!
    </div>

    <!-- COUNTER -->

    <div class="counter">

      <div class="counterTop"></div>

      <div class="ingredientsTray">

        <button
          class="ingredientBox"
          data-item="noodles"
          onclick="selectIngredient(this,'noodles')">
          🍜
        </button>

        <button
          class="ingredientBox"
          data-item="egg"
          onclick="selectIngredient(this,'egg')">
          🥚
        </button>

        <button
          class="ingredientBox"
          data-item="vegetable"
          onclick="selectIngredient(this,'vegetable')">
          🥬
        </button>

        <button
          class="ingredientBox"
          data-item="onion"
          onclick="selectIngredient(this,'onion')">
          🧅
        </button>

        <button
          class="ingredientBox"
          data-item="pepper"
          onclick="selectIngredient(this,'pepper')">
          🌶️
        </button>

      </div>

      <div class="stove">

        <div class="burner"></div>

        <div class="flame" id="flame">
          🔥
        </div>

        <div class="pot">

          <div class="potInside">

            <div class="noodles" id="noodles"></div>

            <div class="foodExtras" id="foodExtras"></div>

          </div>

          <div class="handle"></div>

        </div>

      </div>

    </div>

    <!-- CONTROLS -->

    <div class="controls">

      <button
        class="action primary"
        onclick="startChallenge()">
        ▶ START
      </button>

      <button
        class="action"
        onclick="cook()">
        🔥 COOK
      </button>

      <button
        class="action"
        onclick="stir()">
        🥄 STIR
      </button>

      <button
        class="action danger"
        onclick="serve()">
        🍽️ SERVE
      </button>

    </div>

    <div class="scorePop" id="scorePop">
      +10
    </div>

  </div>

</div>

<!-- RESULT -->

<div class="resultScreen" id="resultScreen">

  <div class="resultCard">

    <h1 id="resultTitle">
      🏆 CHALLENGE COMPLETE
    </h1>

    <div class="resultStars" id="resultStars">
      ⭐⭐⭐⭐⭐
    </div>

    <div class="finalScore">
      <span id="finalScore">0</span>
    </div>

    <p id="resultText">
      The judge is ready to give your final result.
    </p>

    <button
      class="playAgain"
      onclick="location.reload()">
      🔄 PLAY AGAIN
    </button>

  </div>

</div>

<script>

let gameStarted = false;
let time = 90;
let score = 0;
let selectedIngredient = null;
let ingredients = [];
let timerInterval = null;
let cooked = false;

const timerElement =
  document.getElementById("timer");

const scoreElement =
  document.getElementById("score");

const timerBox =
  document.getElementById("timerBox");

const message =
  document.getElementById("message");

const speech =
  document.getElementById("speech");

const flame =
  document.getElementById("flame");

const noodles =
  document.getElementById("noodles");

const foodExtras =
  document.getElementById("foodExtras");

const scorePop =
  document.getElementById("scorePop");

const resultScreen =
  document.getElementById("resultScreen");


function startChallenge(){

  if(gameStarted) return;

  gameStarted = true;

  message.textContent =
    "🔥 Challenge started! Add your Indomie first.";

  speech.textContent =
    "The clock is running. Let's see what you've got, Jessy!";

  timerInterval = setInterval(function(){

    time--;

    timerElement.textContent =
      time;

    if(time <= 20){
      timerBox.classList.add("danger");
    }

    if(time <= 0){

      clearInterval(timerInterval);

      gameStarted = false;

      message.textContent =
        "⏰ Time is up! Serve your dish!";

      speech.textContent =
        "Time is up! Present your dish.";

    }

  },1000);

}


function selectIngredient(button,item){

  if(!gameStarted){

    message.textContent =
      "Press START before choosing ingredients.";

    return;

  }

  if(item === "noodles" && ingredients.includes("noodles")){

    message.textContent =
      "You've already added the Indomie.";

    return;

  }

  if(item !== "noodles" &&
     !ingredients.includes("noodles")){

    message.textContent =
      "🍜 Add the Indomie before the other ingredients.";

    speech.textContent =
      "Jessy, start with the Indomie.";

    return;

  }

  if(ingredients.includes(item)){

    message.textContent =
      "That ingredient is already in the pot.";

    return;

  }

  document
    .querySelectorAll(".ingredientBox")
    .forEach(function(el){
      el.classList.remove("selected");
    });

  button.classList.add("selected");

  selectedIngredient = item;

  addIngredient(item);

}


function addIngredient(item){

  ingredients.push(item);

  if(item === "noodles"){

    noodles.classList.add("show");

    score += 15;

    message.textContent =
      "🍜 Indomie added to the pot!";

    speech.textContent =
      "Good start. Now build your dish.";

  }

  if(item === "egg"){

    foodExtras.textContent += "🥚";

    foodExtras.classList.add("show");

    score += 8;

    message.textContent =
      "🥚 Egg added!";

  }

  if(item === "vegetable"){

    foodExtras.textContent += "🥬";

    foodExtras.classList.add("show");

    score += 8;

    message.textContent =
      "🥬 Vegetable added!";

  }

  if(item === "onion"){

    foodExtras.textContent += "🧅";

    foodExtras.classList.add("show");

    score += 6;

    message.textContent =
      "🧅 Onion added!";

  }

  if(item === "pepper"){

    foodExtras.textContent += "🌶️";

    foodExtras.classList.add("show");

    score += 6;

    message.textContent =
      "🌶️ Pepper added!";

  }

  updateScore();

}


function cook(){

  if(!gameStarted){

    message.textContent =
      "Press START first.";

    return;

  }

  if(!ingredients.includes("noodles")){

    message.textContent =
      "🍜 You need Indomie in the pot.";

    return;

  }

  flame.classList.add("on");

  cooked = true;

  score += 15;

  updateScore();

  message.textContent =
    "🔥 The stove is on! Your Indomie is cooking.";

  speech.textContent =
    "Good! Watch the heat carefully.";

  popScore("+15");

}


function stir(){

  if(!gameStarted){

    message.textContent =
      "Start the challenge first.";

    return;

  }

  if(!ingredients.includes("noodles")){

    message.textContent =
      "There is nothing to stir yet.";

    return;

  }

  score += 10;

  updateScore();

  message.textContent =
    "🥄 Jessy is stirring the Indomie.";

  speech.textContent =
    "Nice technique! Keep stirring.";

  popScore("+10");

  const pot =
    document.querySelector(".pot");

  pot.animate(
    [
      {transform:"translateX(-50%) rotate(-2deg)"},
      {transform:"translateX(-50%) rotate(2deg)"},
      {transform:"translateX(-50%) rotate(-2deg)"}
    ],
    {
      duration:500,
      iterations:2
    }
  );

}


function serve(){

  if(!gameStarted){

    message.textContent =
      "Start the challenge first.";

    return;

  }

  if(!ingredients.includes("noodles")){

    message.textContent =
      "You haven't prepared the Indomie.";

    return;

  }

  clearInterval(timerInterval);

  gameStarted = false;

  flame.classList.remove("on");

  let bonus = 0;

  if(cooked){
    bonus += 15;
  }

  if(ingredients.length >= 3){
    bonus += 10;
  }

  if(time > 30){
    bonus += 10;
  }

  score += bonus;

  if(score > 100){
    score = 100;
  }

  updateScore();

  showResult();

}


function updateScore(){

  if(score > 100){
    score = 100;
  }

  scoreElement.textContent =
    score;

}


function popScore(text){

  scorePop.textContent =
    text;

  scorePop.classList.remove("show");

  void scorePop.offsetWidth;

  scorePop.classList.add("show");

}


function showResult(){

  const finalScore =
    document.getElementById("finalScore");

  const resultTitle =
    document.getElementById("resultTitle");

  const resultText =
    document.getElementById("resultText");

  const resultStars =
    document.getElementById("resultStars");

  finalScore.textContent =
    score + " / 100";

  if(score >= 85){

    resultTitle.textContent =
      "🏆 JESSY IS THE CHAMPION!";

    resultStars.textContent =
      "⭐⭐⭐⭐⭐";

    resultText.textContent =
      "The judge loved your Indomie! Excellent cooking, timing and presentation.";

    speech.textContent =
      "Outstanding, Jessy! You are today's champion!";

  }else if(score >= 65){

    resultTitle.textContent =
      "🥈 GREAT PERFORMANCE!";

    resultStars.textContent =
      "⭐⭐⭐⭐";

    resultText.textContent =
      "Very good cooking! A little more attention to timing could make you champion.";

    speech.textContent =
      "Very impressive. Keep improving!";

  }else if(score >= 45){

    resultTitle.textContent =
      "🥉 GOOD TRY!";

    resultStars.textContent =
      "⭐⭐⭐";

    resultText.textContent =
      "You completed the challenge, but there is still room to improve.";

    speech.textContent =
      "Good effort, Jessy.";

  }else{

    resultTitle.textContent =
      "KEEP PRACTICING!";

    resultStars.textContent =
      "⭐⭐";

    resultText.textContent =
      "Don't give up. Try different ingredients and improve your cooking technique.";

    speech.textContent =
      "Practice makes perfect. Try again!";

  }

  resultScreen.classList.add("show");

}

</script>

</body>
</html>
