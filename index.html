<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jessy Indomie Cooking Challenge</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#171717;
  color:white;
}

.game{
  max-width:900px;
  margin:auto;
  min-height:100vh;
  background:linear-gradient(#ffb300,#fff3c4);
  overflow:hidden;
}

.header{
  background:#d71920;
  padding:14px;
  text-align:center;
  border-bottom:5px solid #ffd200;
}

.header h1{
  margin:0;
  font-size:25px;
}

.header p{
  margin:5px 0 0;
  font-size:14px;
}

.stats{
  display:flex;
  justify-content:space-around;
  background:#222;
  padding:10px;
  font-weight:bold;
}

.stage{
  position:relative;
  min-height:500px;
  padding:15px;
  background:
    linear-gradient(rgba(255,255,255,.2),rgba(0,0,0,.15)),
    url("Screenshot_2026-08-24-11-06-53-64_680d03679600f7af0b4c700c6b270fe7.jpg");
  background-size:cover;
  background-position:center;
}

.characters{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
}

.person{
  width:30%;
  text-align:center;
  background:rgba(0,0,0,.65);
  border-radius:15px;
  padding:8px;
}

.person img{
  width:100%;
  height:180px;
  object-fit:contain;
  background:#eee;
  border-radius:10px;
}

.person h3{
  margin:6px 0 0;
}

.judge{
  border:3px solid gold;
}

.contestant{
  border:3px solid #00c853;
}

.judge-comment{
  margin-top:8px;
  background:white;
  color:#111;
  padding:8px;
  border-radius:10px;
  font-size:13px;
}

.cooking-area{
  margin:20px auto 0;
  max-width:520px;
  text-align:center;
}

.table{
  background:#6d3517;
  border:8px solid #40200e;
  border-radius:20px;
  padding:20px;
}

.stove{
  background:#111;
  border-radius:20px;
  padding:18px;
  box-shadow:0 8px 20px #0008;
}

.fire{
  font-size:45px;
  animation:fire 0.6s infinite alternate;
}

@keyframes fire{
  from{transform:scale(.9)}
  to{transform:scale(1.1)}
}

.pan{
  margin:auto;
  width:230px;
  height:100px;
  background:#333;
  border-radius:50%;
  border:8px solid #111;
  position:relative;
  overflow:hidden;
}

.food{
  position:absolute;
  inset:15px;
  border-radius:50%;
  background:#e5b63b;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:35px;
}

.food.empty{
  background:#222;
}

.food.cooked{
  background:#d98b20;
}

.ingredients{
  margin-top:15px;
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;
}

.ingredient{
  background:white;
  color:#111;
  border:2px solid #333;
  border-radius:10px;
  padding:8px 10px;
  font-size:14px;
}

.controls{
  margin-top:15px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

button{
  border:none;
  padding:14px;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  background:#d71920;
  color:white;
}

button:active{
  transform:scale(.96);
}

button:disabled{
  opacity:.45;
}

.message{
  margin-top:12px;
  background:#111;
  padding:12px;
  border-radius:12px;
  text-align:center;
  min-height:45px;
}

.result{
  display:none;
  position:fixed;
  inset:0;
  background:#000c;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.result-box{
  background:white;
  color:#111;
  width:100%;
  max-width:400px;
  padding:25px;
  border-radius:20px;
  text-align:center;
}

.result-box h2{
  color:#d71920;
}

@media(max-width:600px){
  .stage{
    min-height:600px;
  }

  .person img{
    height:130px;
  }

  .person h3{
    font-size:14px;
  }

  .pan{
    width:200px;
  }
}
</style>
</head>

<body>

<div class="game">

  <div class="header">
    <h1>🍜 JESSY'S INDOMIE COOKING CHALLENGE</h1>
    <p>Cook • Impress the Judge • Serve • Win!</p>
  </div>

  <div class="stats">
    <div>⏱️ Time: <span id="time">60</span>s</div>
    <div>⭐ Score: <span id="score">0</span></div>
    <div>🔥 Level: <span id="level">1</span></div>
  </div>

  <div class="stage">

    <div class="characters">

      <div class="person judge">
        <img src="Screenshot_2026-08-24-11-10-43-58_680d03679600f7af0b4c700c6b270fe7.jpg"
             alt="Judge">
        <h3>👩‍⚖️ JUDGE</h3>

        <div class="judge-comment" id="judgeComment">
          I'm ready to judge your Indomie!
        </div>
      </div>

      <div class="person contestant">
        <img src="1787567625036.png"
             alt="Jessy Contestant">
        <h3>👩‍🍳 JESSY</h3>
      </div>

    </div>

    <div class="cooking-area">

      <div class="table">

        <div class="stove">

          <div class="fire">🔥</div>

          <div class="pan">
            <div class="food empty" id="food">
              🍳
            </div>
          </div>

          <h3 id="foodStatus">The pan is empty</h3>

        </div>

        <div class="ingredients">

          <button class="ingredient" onclick="addIngredient('🍜 Indomie')">
            🍜 Indomie
          </button>

          <button class="ingredient" onclick="addIngredient('🥚 Egg')">
            🥚 Egg
          </button>

          <button class="ingredient" onclick="addIngredient('🧅 Onion')">
            🧅 Onion
          </button>

          <button class="ingredient" onclick="addIngredient('🌶️ Pepper')">
            🌶️ Pepper
          </button>

          <button class="ingredient" onclick="addIngredient('🥬 Vegetable')">
            🥬 Vegetable
          </button>

        </div>

        <div class="controls">

          <button onclick="startCooking()">
            🍳 Start Cooking
          </button>

          <button onclick="stirFood()">
            🥄 Stir
          </button>

          <button onclick="cookFood()">
            🔥 Cook
          </button>

          <button onclick="serveFood()">
            🍽️ Serve
          </button>

        </div>

        <div class="message" id="message">
          Choose your ingredients to begin!
        </div>

      </div>

    </div>

  </div>

</div>

<div class="result" id="result">

  <div class="result-box">

    <h2>🏆 COMPETITION RESULT</h2>

    <h1 id="finalScore">0 / 100</h1>

    <p id="finalMessage"></p>

    <button onclick="location.reload()">
      🔄 Play Again
    </button>

  </div>

</div>

<script>

let time = 60;
let score = 0;
let cooking = false;
let ingredients = [];
let timer;

const timeDisplay = document.getElementById("time");
const scoreDisplay = document.getElementById("score");
const food = document.getElementById("food");
const foodStatus = document.getElementById("foodStatus");
const message = document.getElementById("message");
const judgeComment = document.getElementById("judgeComment");

function startCooking(){

  if(cooking) return;

  cooking = true;

  message.textContent =
    "🔥 Cooking has started! Add your Indomie and ingredients.";

  judgeComment.textContent =
    "Let's see what Jessy can cook!";

  timer = setInterval(function(){

    time--;

    timeDisplay.textContent = time;

    if(time <= 0){

      clearInterval(timer);

      cooking = false;

      message.textContent =
        "⏰ Time is up! You must serve your food.";

      judgeComment.textContent =
        "Time is up! Serve your dish.";

    }

  },1000);

}

function addIngredient(item){

  if(!cooking){

    message.textContent =
      "Press Start Cooking first!";

    return;

  }

  if(ingredients.includes(item)){

    message.textContent =
      item + " is already in the pan!";

    return;

  }

  ingredients.push(item);

  score += 5;

  scoreDisplay.textContent = score;

  if(ingredients.length === 1){

    food.classList.remove("empty");

    food.textContent = "🍜";

    foodStatus.textContent =
      "Indomie added to the pan!";

  }else{

    food.textContent =
      "🍜🥚🥬";

    foodStatus.textContent =
      "Your Indomie is getting better!";

  }

  message.textContent =
    item + " added!";

  judgeComment.textContent =
    "Good choice! Keep cooking.";

}

function stirFood(){

  if(!cooking){

    message.textContent =
      "Start cooking first!";

    return;

  }

  if(ingredients.length === 0){

    message.textContent =
      "There is nothing to stir yet!";

    return;

  }

  score += 5;

  scoreDisplay.textContent = score;

  foodStatus.textContent =
    "🥄 You are stirring the Indomie!";

  message.textContent =
    "Nice stirring!";

  judgeComment.textContent =
    "Good technique, Jessy!";

}

function cookFood(){

  if(!cooking){

    message.textContent =
      "Start cooking first!";

    return;

  }

  if(!ingredients.includes("🍜 Indomie")){

    message.textContent =
      "You need to add Indomie first!";

    return;

  }

  score += 10;

  scoreDisplay.textContent = score;

  food.classList.add("cooked");

  food.textContent =
    "🍜🔥";

  foodStatus.textContent =
    "🔥 Your Indomie is cooking!";

  message.textContent =
    "The Indomie is cooking nicely!";

  judgeComment.textContent =
    "Mmm... that looks promising!";

}

function serveFood(){

  if(!cooking){

    finishGame();

    return;

  }

  if(!ingredients.includes("🍜 Indomie")){

    message.textContent =
      "You cannot serve an empty dish!";

    return;

  }

  clearInterval(timer);

  cooking = false;

  score += ingredients.length * 5;

  if(score > 100){
    score = 100;
  }

  scoreDisplay.textContent = score;

  finishGame();

}

function finishGame(){

  document.getElementById("finalScore").textContent =
    score + " / 100";

  let finalMessage;

  if(score >= 80){

    finalMessage =
      "🏆 AMAZING! The judge loved your Indomie! You are the champion!";

    judgeComment.textContent =
      "Excellent dish! You deserve the trophy!";

  }else if(score >= 50){

    finalMessage =
      "🥈 GREAT JOB! Your Indomie was good, but you can improve.";

    judgeComment.textContent =
      "Good effort! Keep practicing.";

  }else{

    finalMessage =
      "🍜 KEEP PRACTICING! Your next dish can be much better.";

    judgeComment.textContent =
      "You need more practice.";

  }

  document.getElementById("finalMessage").textContent =
    finalMessage;

  document.getElementById("result").style.display =
    "flex";

}

</script>

</body>
</html>
